name: Release

# 推送 v* 标签时：构建 → 安全自测 → 发布 → 安装包 → 打包 → 创建 GitHub Release 草稿
# SignPath 审批通过后，在 build job 的 sign 段接入云签名（见文件内注释）

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version variables
        id: ver
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "shash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build (Release)
        run: dotnet build src/CleanMaster.App/CleanMaster.App.csproj -c Release --nologo

      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/CleanMaster.App/CleanMaster.App.csproj -c Release -r win-x64
          --self-contained false
          -p:Version=${{ steps.ver.outputs.version }} -p:SourceRevisionId=${{ steps.ver.outputs.shash }}
          -o dist/CleanMaster-${{ steps.ver.outputs.version }}-net8-x64 -v minimal

      - name: Publish (self-contained)
        run: >
          dotnet publish src/CleanMaster.App/CleanMaster.App.csproj -c Release -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }} -p:SourceRevisionId=${{ steps.ver.outputs.shash }}
          -o dist/CleanMaster-${{ steps.ver.outputs.version }}-win-x64-selfcontained -v minimal

      - name: Strip PDBs (avoid leaking build machine paths)
        shell: pwsh
        run: Get-ChildItem dist -Recurse -Include *.pdb | Remove-Item -Force

      - name: Safety self-test (release gate)
        run: ./dist/CleanMaster-${{ steps.ver.outputs.version }}-net8-x64/CleanMaster.exe --selftest

      # ============================================================
      # SignPath 云签名（开源签名审批通过后启用）：
      #   1. 在 SignPath 中把该仓库关联到签名策略（GitHub App 授权）
      #   2. 仓库 Secrets 配置: SIGNPATH_API_TOKEN / SIGNPATH_ORG_ID /
      #      SIGNPATH_PROJECT_ID / SIGNPATH_SIGNING_POLICY
      #   3. 在此处对 dist 下产物提交签名请求，回传签名产物再打包
      # ============================================================

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
                  "/DSrcDir=$PWD/dist/CleanMaster-${{ steps.ver.outputs.version }}-win-x64-selfcontained" `
                  scripts/setup.iss

      - name: Pack zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/CleanMaster-${{ steps.ver.outputs.version }}-win-x64-selfcontained/*" `
            -DestinationPath "dist/CleanMaster-${{ steps.ver.outputs.version }}-win-x64.zip"

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".zip", ".exe" }
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $f.FullName).Hash, $f.Name }
          $lines | Set-Content dist/SHA256SUMS.txt

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
